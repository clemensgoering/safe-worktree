name: Publish

# Publishes to npm with provenance when a GitHub release is published.
# Requires an NPM_TOKEN secret (Automation token) on the repository.
on:
  release:
    types: [published]
  workflow_dispatch: # republish the current package.json version after a workflow fix

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      # Node 22 bundles npm 10.x, which cannot do the OIDC handshake that
      # trusted publishing needs — it silently falls back to token auth and
      # fails. Trusted publishing requires npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
